# Rilis otomatis LanDesk.
#
# Cara merilis versi baru:
#   1. Naikkan __version__ di server.py (mis. 1.3.1), tulis perubahannya di CHANGELOG.md, commit.
#   2. git tag v1.3.1 && git push origin main --tags
# Workflow ini mem-build paket Windows (zip + setup.exe), paket Ubuntu (.deb), dan paket update
# kecil + latest.json, lalu membuat GitHub Release. LanDesk di semua PC akan menawarkan update.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows packages
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1 `
            -Python "${{ steps.py.outputs.python-path }}" -WorkDir "$env:RUNNER_TEMP\landesk-build"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  linux-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cek versi = tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(python -c "import re;print(re.search(r'^__version__ = \"(.+)\"', open('server.py').read(), re.M).group(1))")
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak sama dengan __version__ = $VER di server.py"; exit 1
          fi
      - name: Build .deb dan paket update
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python -m pip install --quiet pillow
          python packaging/linux/build_deb.py
          # catatan di bar update: bagian versi ini di CHANGELOG.md, kalau kosong pakai pesan commit
          NOTES=$(python packaging/release_notes.py "${GITHUB_REF_NAME}")
          [ -n "$NOTES" ] || NOTES="$COMMIT_MSG"
          RELEASE_NOTES="$NOTES" python packaging/make_update.py --repo "${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-update
          path: |
            dist/*.deb
            dist/landesk-app-*.zip
            dist/latest.json

  release:
    needs: [windows, linux-and-update]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          VER="${GITHUB_REF_NAME#v}"
          {
            python3 packaging/release_notes.py "$VER"
            echo
            echo "## Download"
            echo "| File | Untuk |"
            echo "|---|---|"
            echo "| \`LanDesk-$VER-win64-portable.zip\` | **Windows 10/11 (disarankan)**: ekstrak, jalankan \`Install.cmd\`. Lolos Smart App Control. |"
            echo "| \`LanDesk-Setup-$VER-win64.exe\` | Windows tanpa Smart App Control |"
            echo "| \`landesk_${VER}_all.deb\` | Ubuntu 22.04+ / Debian 12+: \`sudo apt install ./landesk_${VER}_all.deb\` |"
            echo
            echo "LanDesk 1.3.0 ke atas akan menawarkan update ini otomatis (\`landesk-app-$VER.zip\` + \`latest.json\`)."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LanDesk $VER" \
            --notes-file notes.md \
            --generate-notes
